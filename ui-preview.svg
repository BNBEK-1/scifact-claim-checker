<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><rect width="1200" height="900" fill="#f7f8fa"/><rect width="1200" height="62" fill="#fff"/><line x1="0" y1="61" x2="1200" y2="61" stroke="#e6e8eb"/><text x="35" y="39" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#202124">SciFact Claim Checker</text><text x="1040" y="38" font-family="Arial,sans-serif" font-size="13" fill="#6b7280">Research demo</text><text x="120" y="139" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#202124">Scientific Claim Checker</text><text x="120" y="174" font-family="Arial,sans-serif" font-size="16" fill="#5f6368">Search biomedical abstracts, inspect evidence sentences, and abstain when unsure.</text><rect x="120" y="205" width="960" height="68" rx="9" fill="#fff8e6" stroke="#f1d28b"/><circle cx="147" cy="239" r="10" fill="#b7791f"/><text x="143.5" y="244" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#fff">!</text><text x="170" y="234" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#6b4e16">Research demo only</text><text x="170" y="254" font-family="Arial,sans-serif" font-size="14" fill="#6b4e16">It cannot verify arbitrary claims and must not be used for medical decisions.</text><text x="120" y="322" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#30343b">Scientific claim</text><rect x="120" y="337" width="960" height="108" rx="8" fill="#fff" stroke="#cfd3d8"/><text x="140" y="374" font-family="Arial,sans-serif" font-size="15" fill="#9aa0a6">Example: Vitamin D supplementation reduces the risk of respiratory infections.</text><text x="120" y="493" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#30343b">Retrieval method</text><text x="448" y="493" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#30343b">Abstracts to check</text><text x="776" y="493" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#30343b">Abstain threshold</text><rect x="120" y="507" width="290" height="46" rx="7" fill="#fff" stroke="#cfd3d8"/><text x="137" y="536" font-family="Arial,sans-serif" font-size="15" fill="#30343b">Hybrid</text><text x="386" y="536" font-family="Arial,sans-serif" font-size="16" fill="#73777d">⌄</text><rect x="448" y="507" width="290" height="46" rx="7" fill="#fff" stroke="#cfd3d8"/><text x="467" y="536" font-family="Arial,sans-serif" font-size="15" fill="#30343b">10</text><line x1="483" y1="530" x2="709" y2="530" stroke="#d6d9dd" stroke-width="4"/><line x1="483" y1="530" x2="570" y2="530" stroke="#ff4b4b" stroke-width="4"/><circle cx="570" cy="530" r="8" fill="#ff4b4b"/><rect x="776" y="507" width="304" height="46" rx="7" fill="#fff" stroke="#cfd3d8"/><text x="795" y="536" font-family="Arial,sans-serif" font-size="15" fill="#30343b">0.55</text><line x1="845" y1="530" x2="1046" y2="530" stroke="#d6d9dd" stroke-width="4"/><line x1="845" y1="530" x2="930" y2="530" stroke="#ff4b4b" stroke-width="4"/><circle cx="930" cy="530" r="8" fill="#ff4b4b"/><rect x="120" y="588" width="180" height="47" rx="7" fill="#ff4b4b"/><text x="156" y="617" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">Find evidence</text><text x="120" y="680" font-family="Arial,sans-serif" font-size="14" fill="#70757a">Enter a claim to enable the search button.</text><rect x="120" y="735" width="960" height="72" rx="8" fill="#fff" stroke="#e1e4e8"/><text x="145" y="778" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#30343b">What this demo can and cannot do</text><text x="1033" y="778" font-family="Arial,sans-serif" font-size="18" fill="#70757a">⌄</text><text x="120" y="859" font-family="Arial,sans-serif" font-size="13" fill="#8a8f95">UI preview of the app's initial screen · Streamlit layout</text></svg>
